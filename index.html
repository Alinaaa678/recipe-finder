<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Finder</title>
    <link rel="stylesheet" href="style.css">
<base target="_blank">
</head>
<body>
    <div class="container">
        <h1 class="title">🍴 Recipe Finder</h1>
        <p class="subtitle">Find delicious recipes from around the world</p>
        <p class="credit">Data from <a href="https://www.themealdb.com" target="_blank">TheMealDB</a></p>

        <form id="search-form">
            <input type="text" id="search-input" placeholder="Search for meals or keywords">
            <button type="submit" id="search-btn">Search</button>
        </form>

        <div id="result-heading"></div>

        <div id="meals" class="meals"></div>

        <div id="single-meal"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
